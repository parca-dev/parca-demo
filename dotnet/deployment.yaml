apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: demo-dotnet
  name: dotnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-dotnet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-dotnet
    spec:
      containers:
      - image: quay.io/brancz/parca-demo-dotnet:latest
        imagePullPolicy: Always
        name: dotnet
        resources:
          limits:
            cpu: '100m'
            memory: '256Mi'
